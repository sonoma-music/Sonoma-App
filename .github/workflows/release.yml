# Builds Sonoma for every platform and attaches the files to a GitHub Release.
# Runs when a tag like v0.2.0 is pushed (or by hand from the Actions tab).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, script: dist:win, files: 'release/Sonoma-Setup.exe' }
          - { name: Linux, os: ubuntu-latest, script: dist:linux, files: "release/Sonoma-linux-x64.AppImage\nrelease/Sonoma-linux-x64.tar.gz" }
          - { name: macOS, os: macos-latest, script: dist:mac, files: "release/Sonoma-mac-arm64.dmg\nrelease/Sonoma-mac-x64.dmg" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with: { name: 'desktop-${{ matrix.name }}', path: '${{ matrix.files }}', if-no-files-found: error }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install (root deps are shared with the desktop app)
        run: |
          npm ci --ignore-scripts
          cd mobile && npm ci
      - name: Build web bundle and Android project
        working-directory: mobile
        run: |
          node build.js
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#0b2a66' --iconBackgroundColorDark '#0b2a66' --splashBackgroundColor '#0b1e36' --splashBackgroundColorDark '#0b1e36'
          npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Sonoma-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: Sonoma-android.apk, if-no-files-found: error }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: Sonoma-android.apk, fail_on_unmatched_files: true }

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Install
        run: |
          npm ci --ignore-scripts
          cd mobile && npm ci
      - name: Build web bundle and iOS project
        working-directory: mobile
        run: |
          node build.js
          npx cap add ios
          npx @capacitor/assets generate --ios --iconBackgroundColor '#0b2a66' --splashBackgroundColor '#0b1e36' --splashBackgroundColorDark '#0b1e36'
          npx cap sync ios
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" $PLIST || true
      - name: Build unsigned IPA
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -20
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../../Sonoma-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: Sonoma-ios-unsigned.ipa, if-no-files-found: error }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: Sonoma-ios-unsigned.ipa, fail_on_unmatched_files: true }
